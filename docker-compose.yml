services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: liralink
      POSTGRES_PASSWORD: liralink
      POSTGRES_DB: liralink
    ports:
      - "5434:5432"   # 5432/5433 are commonly taken by other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
